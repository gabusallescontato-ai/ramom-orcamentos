async function fromRaw(bits){
  const key=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['encrypt','decrypt']);
  const tag=new Uint8Array(bits.length+3);tag.set(bits);tag.set([108,105,100],bits.length);
  const h=new Uint8Array(await crypto.subtle.digest('SHA-256',tag));
  return{key,lid:b64(h.slice(0,9)),raw:b64(bits)};
}
async function derive(secret,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveBits']);
  return fromRaw(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:te.encode(salt),iterations:iter},base,256)));
}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)))))}}

function calcAll(){const P=R.p;document.querySelectorAll('[data-calc]').forEach(el=>{const[k,i]=el.dataset.calc.split('.'),pk=P&&P.packages[+i];if(!pk)return;const t=pkgTotal(pk),c=pkgCost(pk);

  if(n==='orcamento'&&!C){const sv=ls.get('rs-code');if(sv)openCode(sv,true).catch(()=>{})}}
async function openCode(code,quiet){code=norm(code);if(!code){X.err='Digite o código que você recebeu.';return render()}
  if(code==='DEMO'){C={code:'DEMO',data:demo(),demo:true}}
  else{if(!crypto.subtle){X.err='Este navegador não consegue abrir o orçamento. Tente em um navegador atualizado.';return render()}
    X.busy=true;if(!quiet)render();let data=null;const L=LINK||ls.get('rs-link');
    if(L){try{const q=String(L).split('.'),k=await derive(code,'c:'+q[1],CITER),o=await unpack(+q[0],new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(q[2])},k.key,unb64(q[3]))));data=o.c;OV=pickSt(o.s);ss.set('rs-st',OV)}catch(e){}}
    if(!data&&S.salt){const k=await derive(code,'c:'+S.salt,CITER),box=S.pub[k.lid];if(box)data=await unseal(k.key,box)}
    X.busy=false;
    if(!data){if(quiet){ls.del('rs-code');return}X.err='Não encontramos um orçamento para esse código. Confira se digitou igual ao da mensagem.';return render()}
    C={code:code.slice(0,4)+'-'+code.slice(4),data};ls.set('rs-code',code)}
  X.err='';X.code='';V.pid=null;V.orient=null;go('orcamento')}

  openProp(d){V.adm.cid=d.c;V.adm.pid=d.i;V.adm.prev=false;render();try{scrollTo(0,0)}catch(e){}},
  newProp(){const{c}=cur(),P=newProp(X.ptype,c.brief||{},A.vault);c.proposals.push(P);c.rev++;V.adm.pid=P.id;scheduleSave();render()},
  importBrief(){const m=String(X.imp).match(/BRF1\.([A-Za-z0-9_-]+)/);if(!m)return toast('Não achei o código do pedido (BRF1…) na mensagem.');let b;try{b=JSON.parse(td.decode(unb64(m[1])))}catch(e){return toast('O código do pedido veio incompleto. Peça para o cliente reenviar.')}
    const c={id:uid(),name:b.nome||'',contact:b.empresa||'',code:newCode(),rev:1,brief:b,proposals:[]},P=newProp(TYPES[b.t]?b.t:'outro',b,A.vault);c.proposals.push(P);A.vault.clients.unshift(c);X.imp='';V.adm.cid=c.id;V.adm.pid=P.id;scheduleSave();render();toast('Pedido importado. Revise os valores.')},
  copyInvite(){copy('Oi! Para eu montar seu orçamento certinho, responde estas perguntas rápidas (leva uns 2 minutos):\n'+(WEB?location.origin+location.pathname+'#b='+b64(te.encode(JSON.stringify(pickSt(S.studio)))):(S.studio.link||'[link do site]')+'\nToque em "Pedir orçamento".'),'Convite copiado.')},
  copyCode(){copy(cur().c.code,'Código copiado.')},
  async copyCliMsg(){const{c,P}=cur();if(noSent(c))return;const sent=c.proposals.filter(p=>p.status!=='rascunho');copy(cliMsg(c,P&&P.status!=='rascunho'?P:sent[sent.length-1]||c.proposals[c.proposals.length-1],await siteLink(c)),'Mensagem copiada.')},
  async follow(d){const c=A.vault.clients.find(c=>c.id===d.c),P=c.proposals.find(p=>p.id===d.i);copy(followMsg(c,P,await siteLink(c)),'Lembrete copiado.')},
  delCli(d){const{c}=cur();if(d.i==='ask'){X.del=c.id;return render()}A.vault.clients=A.vault.clients.filter(x=>x!==c);V.adm.cid=null;X.del=null;scheduleSave();render()},
  delProp(d){const{c,P}=cur();if(d.i==='ask'){X.del=P.id;return render()}c.proposals=c.proposals.filter(x=>x!==P);c.rev++;V.adm.pid=null;X.del=null;scheduleSave();render()},
  rm(d){getp(d.p).splice(+d.i,1);touched(d.p);render()},
  rmPkg(d){const P=R.p;P.packages.splice(+d.i,1);P.rec=Math.min(P.rec,P.packages.length-1);touched('p');render()},
  dupPkg(d){const P=R.p,k=JSON.parse(JSON.stringify(P.packages[+d.i]));k.name+=' (cópia)';P.packages.splice(+d.i+1,0,k);touched('p');render()},
  addFact(){R.p.facts.push(['','']);touched('p');render()},
  addRow(d){getp(d.p).push(['','']);touched(d.p);render()},
  addBlank(d){R.p.packages[+d.i].items.push({name:'',desc:'',qty:1,price:0,cost:0});touched('p');render()},
  addAddon(){R.p.addons.push({name:'',desc:'',price:0});touched('p');render()},
  addPrice(){A.vault.prices.push({id:uid(),cat:'Extras',name:'',desc:'',unit:'un',price:0,cost:0});scheduleSave();render()},
  newVer(){const P=R.p;P.ver++;P.created=today();P.validUntil=addDays(today(),+A.vault.terms.validDays||7);touched('p');render();toast('Versão '+P.ver+'. A validade foi renovada.')},
  preview(){V.adm.prev=!V.adm.prev;render();try{scrollTo(0,0)}catch(e){}},
  async chPw(){if(String(X.np).length<8)return toast('A nova senha precisa de pelo menos 8 caracteres.');const k=await derive(X.np,'a:'+S.salt,AITER);A.key=k.key;A.raw=k.raw;ss.set('rs-ak',A.raw);X.np='';await saveLocal();render();toast('Senha trocada. Publique para valer em outros aparelhos.')},
  async backup(){await saveLocal();const data=JSON.stringify(S);if(!DL&&!WEB)return copy(data,'Cópia de segurança copiada. Cole em um arquivo de texto.');try{await saveFile('orcamentos-copia-'+today()+'.json',data)}catch(e){}},
  discard(){ls.del('rs-local');A=null;ss.del('rs-ak');S=JSON.parse($('#rs-data').textContent);localAhead=false;render();toast('Voltou para a versão publicada.')},
  async publish(){await saveLocal();if(!ART){canPub=false;return syncUi()}ss.set('rs-ak',A.raw);ss.set('rs-v',V);
    try{await ART.publish(buildDoc(S));ls.del('rs-local');localAhead=false;syncUi();toast('Publicado. Os clientes já veem a versão nova.')}
    catch(e){const code=e&&e.code;if(code==='conflict')toast('Outra versão foi publicada antes. A página vai recarregar e suas alterações continuam salvas neste aparelho.');
      else if(code==='too_large')toast('Os dados passaram do limite de tamanho. Exclua orçamentos antigos e tente de novo.');
      else if(code==='rate_limited'||code==='upstream_error')toast('Não deu para publicar agora. Espere um minuto e tente de novo.');
      else{canPub=false;syncUi();toast('Este acesso é só de leitura. As alterações ficaram salvas neste aparelho.')}}}
};
const CH={
  selPkg(el){const P=PAINT.P,s=getSel(P);s.pkg=+el.value;setSel(P,s);render()},
  selAdd(el){const P=PAINT.P,s=getSel(P),i=+el.value;s.addons=el.checked?[...new Set([...s.addons,i])]:s.addons.filter(x=>x!==i);setSel(P,s);render()},
  setRec(el){R.p.rec=+el.value;touched('p')},
  addItem(el){const p=A.vault.prices.find(x=>x.id===el.value);if(!p)return;R.p.packages[+el.dataset.i].items.push({name:p.name,desc:p.desc,qty:1,price:p.price,cost:p.cost||0,cat:p.cat});touched('p');render()},
  restore(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.vault||!o.salt)throw 0;o.rev=Math.max(o.rev||0,S.rev)+1;S=o;ls.set('rs-local',S);localAhead=true;A=null;ss.del('rs-ak');render();toast('Cópia restaurada. Entre com a senha dela.')}catch(e){toast('Este arquivo não é uma cópia de segurança válida.')}};r.readAsText(f)}
};
const run=(f,a,b)=>{if(f)Promise.resolve().then(()=>f(a,b)).catch(e=>{console.error(e);X.busy=false;toast('Algo deu errado. Tente de novo.')})};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el){if(el.tagName==='A')e.preventDefault();return run(ACT[el.dataset.a],el.dataset,el)}
  const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();const n=a.getAttribute('href').slice(1);if(VIEWS.includes(n)){if(n==='briefing'&&V.name!=='briefing')V.step=V.step||0;go(n)}}});
document.addEventListener('submit',e=>{e.preventDefault();run(ACT[e.target.dataset.f],e.target.dataset,e.target)});
document.addEventListener('input',e=>{const el=e.target,p=el.dataset&&el.dataset.b;if(!p)return;let v;
  if(el.dataset.multi){v=(getp(p)||[]).filter(x=>x!==el.value);if(el.checked)v.push(el.value)}else v=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?'':+el.value):el.value;
  setp(p,v);touched(p);calcAll()});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset)return;if(el.dataset.ch)run(CH[el.dataset.ch],el);else if(el.dataset.re!=null)setTimeout(render,0)});
function readHash(){const h=location.hash.slice(1);
  if(h.startsWith('o=')){if(LINK!==h.slice(2))C=null;LINK=h.slice(2);ls.set('rs-link',LINK);V.name='orcamento';return true}
  if(h.startsWith('b=')){try{OV=pickSt(JSON.parse(td.decode(unb64(h.slice(2)))));ss.set('rs-st',OV)}catch(e){}V.name='briefing';return true}
  if(VIEWS.includes(h)&&h!==V.name){V.name=h;return true}return false}
addEventListener('hashchange',()=>{if(readHash()){X.err='';render()}});

/* ---------- início ---------- */
window.__rs={derive,seal,unseal,renderSheets,pdfFrom,demo,buildDoc,makeLink,pub,newProp,defaultVault,briefMsg,openCode,saveLocal,ACT,X,state:()=>({S,A,C,V,localAhead})};
(async()=>{readHash();
  const ak=ss.get('rs-ak');if(ak&&S.vault&&crypto.subtle){try{const k=await fromRaw(unb64(ak));A={key:k.key,raw:ak,vault:await unseal(k.key,S.vault)};const sv=ss.get('rs-v');if(sv){V=sv;ss.del('rs-v')}}catch(e){ss.del('rs-ak')}}
  render();
  const saved=ls.get('rs-code');if(saved&&!C&&V.name==='orcamento')openCode(saved,true).catch(()=>{});
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  use('artifact').then(a=>{ART=a;syncUi()});use('downloads').then(d=>{DL=d});
})();
})();
